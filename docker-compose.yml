services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mpu
      POSTGRES_USER: mpu
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - mpu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpu -d mpu"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mpu_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin change-me; do sleep 2; done;
      mc mb --ignore-existing local/mpu-public;
      mc mb --ignore-existing local/mpu-private;
      mc anonymous set download local/mpu-public;
      exit 0;"

volumes:
  mpu_postgres:
  mpu_minio:
